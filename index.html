  const [gcalConfirmTick, setGcalConfirmTick] = useState(0);
  // taskId -> the calendar id we last actually saw this task's event living in.
  // This is what lets pushTask/deleteTask clean up a stale copy after a type
  // change without guessing — and, just as importantly, what lets them do
  // *nothing* extra when there's no prior copy to clean up at all.
  const gcalLoc = useRef({});
  const gcalSeenIds = useRef(new Set());   // ids we have actually observed locally
  const gcalFailed = useRef({});           // taskId -> message
  // Whether gcalPullNow has ever completed a full pull this "session" (since
  // connect / reconnect). Deliberately its own flag rather than inferring
  // "first pull" from gcalRemote.current being empty -- a manual rescan used
  // to reset gcalRemote.current right before pulling, which made every scan
  // look like the very first pull ever and re-armed the much more aggressive
  // "not found remotely -> delete locally" rule meant only for true first
  // pulls. That accidentally deleted tasks whose event simply hadn't shown up
  // in that one read yet (timing, pagination, a concurrent delete elsewhere).
  const gcalHasPulledOnce = useRef(false);
  const gcalQueue = useRef(Promise.resolve());
  const gcalSyncing = useRef(false);

  // ── Foreign ("non-TaskIt") Google events — separate bookkeeping ──────────
  // taskId -> a signature of what we last saw for this owned foreign task,
  // either straight from a pull or right after we pushed an edit to it. Only
  // owned (non-shared) "google" tasks are ever pushed back to Google; shared
  // ones are read-only and never appear here.
  const gcalForeignPushed = useRef({});
  const gcalForeignSyncing = useRef(false);
  const [gcalForeignReady, setGcalForeignReady] = useState(false);
  const gcalForeignSig = t => JSON.stringify([
    String(t.name || ""), String(t.note || ""), String(t.date || ""), String(t.time || ""),
    t.length == null ? "" : String(t.length), t.done ? 1 : 0, t.cancelled ? 1 : 0
  ]);

  const gcalEnqueue = fn => {
    gcalQueue.current = gcalQueue.current.then(fn, fn);
    return gcalQueue.current;
  };

  const gcalRecomputeStats = (taskList, remote) => {
    let synced = 0, pending = 0, skipped = 0;
    const problems = [];
    for (const t of taskList) {
      if (t.source === "google") continue; // reported separately, not part of the TaskIt sync stats
      const reason = GCal.syncSkipReason(t);
      if (reason) {
        skipped++; problems.push({ id: t.id, name: t.name || "", reason });
        continue;
      }
      if (gcalFailed.current[t.id]) { problems.push({ id: t.id, name: t.name || "", reason: "failed", detail: gcalFailed.current[t.id] }); continue; }
      if (remote[t.id] === GCal.taskSignature(t)) synced++; else pending++;
    }
    setGcalStats(s => ({
      ...s,
      synced, pending, skipped,
      failed: Object.keys(gcalFailed.current).length,
      problems: problems.slice(0, 20)
    }));
  };

  const gcalPullNow = async () => {
    if (!gcalConnected || gcalSyncing.current) return;
    gcalSyncing.current = true;
    setGcalPulling(true);
    try {
      const { events, complete } = await GCal.pullAll();
      const remote = {};
      const byId = {};
      const loc = {};
      // Looked up by id so a holiday event's actual fields can be checked
      // against what's already stored locally, not against a patch built from
      // whatever Google currently has (which is exactly what might have drifted).
      const localById = {};
      for (const t of tasks) localById[t.id] = t;
      const NEEDS_REPAIR = "__needs_repair__"; // never equals a real taskSignature() output
      // A holiday's name/date/time are TaskIt's own to define, but whether the
      // person ticked it off (done / cancelled) is theirs -- and may have been
      // set on another device. Last write wins, exactly like every other task:
      // the event's Google-side modified time vs. this device's own `updated`.
      // Returns just the state fields to adopt, or null to keep the local ones.
      const holidayStateFromEvent = (event, local) => {
        const pv = event.extendedProperties?.private || {};
        const rd = pv.done === "1", rc = pv.cancelled === "1";
        if (rd === !!local.done && rc === !!local.cancelled) return null;
        const remoteUpdated = event.updated ? new Date(event.updated).getTime() : 0;
        if (local.updated && !(remoteUpdated >= local.updated)) return null;
        return { done: rd, cancelled: rc, updated: remoteUpdated || Date.now() };
      };
      for (const { event, calendarId } of events) {
        const tid = event.extendedProperties?.private?.taskitId;
        if (!tid) continue;
        byId[tid] = event;
        loc[tid] = calendarId;
        const rawLocal = localById[tid];
        const adoptedState = rawLocal && GCal.isHolidayTask(rawLocal) ? holidayStateFromEvent(event, rawLocal) : null;
        // Compare against the state we are about to adopt, otherwise a holiday
        // completed elsewhere looks "drifted" here and gets pushed back to Google
        // as pending, undoing the completion.
        const localTask = adoptedState ? { ...rawLocal, ...adoptedState } : rawLocal;
        // Holiday events are a read-only mirror of what TaskIt itself computed —
        // never meant to be edited, locally or on Google's side. Nothing stops
        // someone renaming, redating, or adding a time/note to one directly in
        // Google Calendar, though, and the stored "sig" survives that untouched
        // (it's not a field the Calendar UI exposes), so it alone would call a
        // drifted event "in sync" forever. Recording a signature that can never
        // match forces the push effect below to restore it instead.
        remote[tid] = (localTask && GCal.isHolidayTask(localTask) && !GCal.eventMatchesTask(event, localTask))
          ? NEEDS_REPAIR
          : (GCal.remoteSigOf(event) || "");
      }
      const hadBefore = gcalRemote.current;
      gcalRemote.current = remote;
      gcalLoc.current = loc;
      // What Google actually holds right now. Merged (not replaced) so a push
      // that confirmed while this pull was in flight isn't forgotten.
      const confirmedNow = { ...gcalConfirmed.current };
      for (const [tid, event] of Object.entries(byId)) confirmedNow[tid] = GCal.remoteSigOf(event) || "";
      gcalConfirmed.current = confirmedNow;

      // Ids deleted on this device while Google couldn't be reached. Their
      // events must not be pulled back in (that resurrected them), and get
      // deleted on Google below instead.
      const tombstones = new Set(outboxRef.current.deleted);
      const localPresent = new Set([...tasks, ...archiveTasks].map(t => t.id));
      for (const tid of [...tombstones]) if (localPresent.has(tid)) tombstones.delete(tid);
      // One-time rescue of the old full local copy (see legacyRescueRef). Only
      // on a complete pull, so Google's answer is the whole picture.
      const legacy = complete ? legacyRescueRef.current : null;

      setTasks(ts => {
        // Archived tasks keep their event but must never be resurrected into the
        // active list — that used to silently clone every archived task back.
        const archivedIds = new Set(archiveTasks.map(t => t.id));
        let next = ts;
        for (const [tid, event] of Object.entries(byId)) {
          if (archivedIds.has(tid)) continue;
          if (tombstones.has(tid)) continue;
          const existing = next.find(t => t.id === tid);
          // Never let a pulled event overwrite an existing holiday task's own
          // fields — see the NEEDS_REPAIR comment above. The task stays exactly
          // what TaskIt generated; it's Google's copy that gets corrected, by
          // the push effect, not the other way around.
          if (existing && GCal.isHolidayTask(existing)) {
            const st = holidayStateFromEvent(event, existing);
            if (st) next = (next === ts ? [...ts] : next).map(t => t.id === tid ? { ...t, ...st } : t);
            continue;
          }
          const patch = GCal.eventToTaskPatch(event);
          if (!existing) {
            next = next === ts ? [...ts] : next;
            // Nothing local remembers when a pulled task was created any more,
            // so use the event's own creation time -- stable across reloads and
            // devices -- rather than "now", which reset on every load.
            const createdAt = event.created ? new Date(event.created).getTime() : NaN;
            next.push({ id: tid, created: Number.isNaN(createdAt) ? Date.now() : createdAt, ...patch });
          } else if (!existing.updated || patch.updated >= existing.updated) {
            next = (next === ts ? [...ts] : next).map(t => t.id === tid ? { ...t, ...patch } : t);
          }
        }
        // A task that Google no longer has was deleted on another device.
        // Only a complete pull may conclude this; a partial read never deletes locally.
        // On the very first pull (hadBefore is empty) we use initialLocalIds to tell
        // apart "was in localStorage at startup → deleted elsewhere → remove" from
        // "created in this session, not pushed yet → keep".
        if (complete) {
          const isFirstPull = !gcalHasPulledOnce.current;
          next = (next === ts ? [...ts] : next).filter(t => {
            if (t.source === "google") return true; // lives in a foreign calendar, handled by gcalPullForeignNow
            // Holiday tasks are regenerated locally, not "owned" by whatever
            // Google currently has. If someone deletes the event in Google, that
            // is something to recreate on the next push, never a reason to give
            // up on the task and remove it here.
            if (GCal.isHolidayTask(t)) return true;
            if (!GCal.shouldSync(t)) return true;
            if (byId[t.id]) return true;
            if (isFirstPull) return !initialLocalIds.current.has(t.id);
            return !(t.id in hadBefore);
          });
        }
        if (legacy && legacy.length) {
          // Keep an old local edit only where Google has the task and the local
          // copy is strictly newer (an edit that never got pushed), plus tasks
          // that can never sync at all (so Google can't have them). Anything
          // else in the old copy -- including the local duplicates -- is dropped,
          // exactly as the first-pull rule above always treated it.
          const byLocalId = new Map(next.map((t, i) => [t.id, i]));
          for (const lt of legacy) {
            if (!lt || !lt.id || lt.source === "google" || GCal.isHolidayTask(lt) || tombstones.has(lt.id)) continue;
            const idx = byLocalId.get(lt.id);
            if (byId[lt.id]) {
              if (idx == null) continue;
              const cur = next[idx];
              if (lt.updated && (!cur.updated || lt.updated > cur.updated)) {
                next = next === ts ? [...ts] : next;
                next[idx] = { ...cur, ...lt };
              }
            } else if (!GCal.shouldSync(lt) && idx == null) {
              next = next === ts ? [...ts] : next;
              byLocalId.set(lt.id, next.length);
              next.push(lt);
            }
          }
        }
        return next;
      });
      if (legacy) legacyRescueRef.current = null;

      // Carry out the deletions that were waiting for Google.
      for (const tid of [...outboxRef.current.deleted]) {
        if (localPresent.has(tid)) { outboxRef.current.deleted.delete(tid); continue; }
        if (byId[tid]) {
          const l = loc[tid];
          gcalEnqueue(() => GCal.deleteTask(tid, l)).then(() => {
            outboxRef.current.deleted.delete(tid);
            delete gcalRemote.current[tid];
            delete gcalLoc.current[tid];
            delete gcalConfirmed.current[tid];
            setGcalConfirmTick(n => n + 1);
          }).catch(() => {}); // still offline / failed: stays in the outbox, retried next pull
        } else if (complete) {
          // Google doesn't have it (never pushed, or already gone) -- nothing left to do.
          outboxRef.current.deleted.delete(tid);
        }
      }
      // Re-evaluates the outbox against what Google just confirmed (and saves
      // any tombstones dropped above).
      setGcalConfirmTick(n => n + 1);

      setGcalStats(s => ({ ...s, lastPull: Date.now() }));
      if (complete) { gcalHasPulledOnce.current = true; setGcalReady(true); setGcalError(""); }
    } catch (e) {
      setGcalError(e.message || String(e));
    } finally {
      gcalSyncing.current = false;
      setGcalPulling(false);
    }
  };

  // Pulls every non-TaskIt calendar and merges the events in as "google"-type
  // tasks. Only ever runs while the toggle is on; turning the toggle off wipes
  // these tasks out again (see handleToggleGcalForeign below) rather than
  // leaving stale copies around.
  const gcalPullForeignNow = async () => {
    if (!gcalConnected || !prefGcalForeign || gcalForeignSyncing.current) return;
    gcalForeignSyncing.current = true;
    try {
      const { tasks: pulled, complete } = await GCal.pullForeign();
      const byId = {};
      for (const p of pulled) byId[p.id] = p;
      // A foreign task that was marked done/cancelled long enough ago to have been
      // moved into archiveTasks must never be resurrected into the active list just
      // because its source event is still sitting on the calendar — same principle
      // gcalPullNow already applies to TaskIt's own archived tasks.
      const archivedIds = new Set(archiveTasks.map(t => t.id));
      // A subscribed Google holiday calendar (many people already have one)
      // covers the same ground the app's own Hebcal/international holiday
      // generation does. Without this check, both would exist as separate
      // local tasks for the same real-world holiday -- genuinely two
      // different Google Calendar events, in two different calendars, which
      // is why they never looked duplicated there, but very much did in
      // TaskIt's own lists.
      const normHolidayName = s => String(s || "").trim().toLowerCase().replace(/^(erev|eve of)\s+/i, "").replace(/[^\p{L}\p{N}]+/gu, "");
      setTasks(ts => {
        const isForeignHolidayDupe = patch => {
          if (!patch.date) return false;
          const names = [normHolidayName(patch.name), normHolidayName(patch.nameEn)].filter(Boolean);
          if (!names.length) return false;
          return ts.some(t => t.date === patch.date && (t.hebcal || t.intl || t.type === "calendar") && (names.includes(normHolidayName(t.name)) || names.includes(normHolidayName(t.nameEn))));
        };
        // The local task id for a foreign event is a deterministic hash of
        // its calendarId+eventId (see foreignTaskId), so re-pulling the same
        // event should always resolve back to the same existing task. But if
        // that ever doesn't hold -- the event briefly shows up under a
        // different owning calendar between pulls, or a pre-existing local
        // task (native or a stale foreign import) already carries this exact
        // googleEventId/googleCalendarId under a different id -- blindly
        // trusting the id match would create a second local task pointing at
        // the very same one Google event. This catches that regardless of id,
        // checking both the active list and the archive, so a task already
        // marked done/cancelled there doesn't get a fresh pending duplicate
        // pushed alongside it.
        const alreadyLinkedElsewhere = patch => {
          if (!patch.googleEventId || !patch.googleCalendarId) return false;
          // A native task's own event id is deterministic (see eventIdForTask) --
          // if this "foreign" event's id matches what some native task's event id
          // would be, it's actually ours: the taskitId exclusion in pullForeign
          // normally catches this, but a freshly-created event can momentarily
          // read back without its extendedProperties visible yet, which is
          // exactly how this class of duplicate slips through.
          const wantEventId = GCal.eventIdForTask ? patch.googleEventId : null;
          if (wantEventId && [...ts, ...archiveTasks].some(t => t.source !== "google" && GCal.eventIdForTask(t.id) === patch.googleEventId)) return true;
          // Otherwise: this exact event (by calendarId+eventId) is already
          // represented locally under a different task id -- the event briefly
          // showed up via a different owning calendar between pulls, or a stale
          // foreign import from before ids were deterministic.
          return ts.some(t => t.id !== patch.id && t.googleEventId === patch.googleEventId && t.googleCalendarId === patch.googleCalendarId) || archiveTasks.some(t => t.googleEventId === patch.googleEventId && t.googleCalendarId === patch.googleCalendarId);
        };
        let next = ts;
        for (const [id, patch] of Object.entries(byId)) {
          if (archivedIds.has(id)) continue;
          const existing = next.find(t => t.id === id);
          if (!existing) {
            if (isForeignHolidayDupe(patch) || alreadyLinkedElsewhere(patch)) continue;
            next = next === ts ? [...ts] : next;
            // Never resurrect done/cancelled state from Google — that's local-only
            // for foreign events (see the note on patchForeignEvent). New imports
            // always start pending.
            next.push({ done: false, cancelled: false, ...patch });
          } else {
            // A ✔ / ✖ mark on the event adopts its status -- but only when the
            // event was edited more recently than the local task, so a status
            // just changed here (not yet pushed back) is never undone by a pull.
            const remoteMarked = !!(patch.done || patch.cancelled);
            const adopt = remoteMarked && !(existing.updated && patch.updated <= existing.updated);
            // Preserve local done/cancelled — those never come from the remote
            // event itself, only from what the person marked in TaskIt. Everything
            // else (title, note, date/time) follows the live Google event: by the
            // time a pull runs, any edit we pushed ourselves has already round-
            // tripped through Google, so last-write-wins here is safe.
            next = (next === ts ? [...ts] : next).map(t => t.id === id ? {
              ...t,
              ...patch,
              done: adopt ? !!patch.done : existing.done,
              cancelled: adopt ? !!patch.cancelled : existing.cancelled
            } : t);
          }
          if (!byId[id]?.googleShared) {
            const merged = next.find(t => t.id === id);
            if (merged) gcalForeignPushed.current[id] = gcalForeignSig(merged);
          }
        }
        // An event that's gone from every foreign calendar (deleted, moved out of
        // the window, or the calendar itself unshared) was removed at the source —
        // drop the local copy too, unless it's already safely archived. Only a
        // complete read may conclude this.
        if (complete) {
          next = (next === ts ? [...ts] : next).filter(t => t.source !== "google" || byId[t.id] || archivedIds.has(t.id));
        }
        return next;
      });
      if (complete) setGcalForeignReady(true);
    } catch (e) {
      // Non-fatal: leave whatever we already have and try again on the next cycle.
    } finally {
      gcalForeignSyncing.current = false;
    }
  };

  const handleToggleGcalForeign = () => {
    const next = !prefGcalForeign;
    setPref(PREF_GCAL_FOREIGN, next ? "yes" : "no");
    setPrefGcalForeign(next);
    if (!next) {
      // Switched off: these tasks only ever exist as a live mirror of Google's
      // own calendars, so they simply disappear — nothing to clean up on the
      // Google side, since none of this ever created new TaskIt calendars.
      setTasks(ts => ts.filter(t => t.source !== "google"));
      gcalForeignPushed.current = {};
      setGcalForeignReady(false);
    } else if (gcalConnected) {
      gcalPullForeignNow();
    }
  };

  const handleConnectGCal = async () => {
    setGcalBusy(true); setGcalError(""); setGcalStatus("");
    try {
      await GCal.connect();
      setGcalConnected(true);
      setGcalNeedsLogin(false);
      // Repair first, then read, then push only what actually differs.
      await GCal.reconcileAndDedupe().catch(() => {});
      await gcalPullNow();
      if (prefGcalForeign) gcalPullForeignNow();
      setGcalStatus(getLang() === "he" ? "מחובר" : "Connected");
    } catch (e) {
      setGcalError(e.message || String(e));
    } finally {
      setGcalBusy(false);
    }
  };

  // Same interactive sign-in as handleConnectGCal, used from the full-screen login
  // gate a standalone/installed web app shows when its silent restore failed.
  const handleLoginGateSignIn = () => handleConnectGCal();

  // "Not now" on the login gate: don't force it, just fall back to the same small
  // reconnect banner a normal browser tab would show, so the person can still get
  // into the app and try again later without losing their place.
  const handleLoginGateSkip = () => {
    setGcalNeedsLogin(false);
    setGcalError("");
  };

  const handleDisconnectGCal = () => {
    GCal.disconnect();
    setGcalConnected(false);
    setGcalReady(false);
    gcalRemote.current = {};
    gcalLoc.current = {};
    gcalFailed.current = {};
    gcalConfirmed.current = {};
    gcalHasPulledOnce.current = false;
    setGcalStatus("");
    setGcalScanMsg("");
    // Foreign events only ever exist as a live mirror while connected — drop them
    // rather than leave a frozen, unsyncable copy behind.
    setTasks(ts => ts.filter(t => t.source !== "google"));
    gcalForeignPushed.current = {};
    setGcalForeignReady(false);
  };

  // One button: dedupe local tasks (same name + same date), clean up any
  // duplicate Google events, then push whatever is still out of sync — and
  // report back deleted / uploaded / failed counts in one line.
  const handleScanGCal = async () => {
    setGcalBusy(true); setGcalError(""); setGcalScanMsg("");
    try {
      const he = getLang() === "he";
      const isHolidayish = tk => !!(tk.hebcal || tk.intl || tk.type === "calendar");
      // Same cross-language/format normalizer as the foreign-pull guard: a
      // subscribed Google holiday calendar and this app's own Hebcal
      // generation rarely word a holiday identically, so an exact string
      // match misses the very duplicates this scan exists to catch.
      const normHolidayName = s => String(s || "").trim().toLowerCase().replace(/^(erev|eve of)\s+/i, "").replace(/[^\p{L}\p{N}]+/gu, "");
      // Previously this skipped every holiday and every foreign-imported task
      // outright, which is exactly why duplicated holidays never got cleaned
      // up here -- they're included now. Regular tasks keep the simple exact
      // name+date match; holiday-ish ones get the fuzzy check below instead,
      // since two genuine duplicates of a holiday are far more likely to be
      // worded differently than two duplicates of a hand-typed task are.
      const isSkippable = tk => !tk.date || !((tk.name || "").trim());
      const normKey = tk => (tk.name || "").trim().toLowerCase() + "|" + (tk.date || "");
      const combined = [
        ...tasks.map(tk => ({ tk, src: "active" })),
        ...archiveTasks.map(tk => ({ tk, src: "archive" }))
      ];
      const eligible = combined.filter(item => !isSkippable(item.tk));
      const toDeleteIds = new Set();
      // Pass 1: exact name+date groups, for everything except foreign
      // imports (which get their own fuzzy pass below, since matching them
      // into one of these groups by exact text would rarely fire).
      const groups = {};
      eligible.filter(item => item.tk.source !== "google").forEach(item => {
        const k = normKey(item.tk);
        (groups[k] = groups[k] || []).push(item);
      });
      // Prefer keeping a live app-generated holiday task over anything else
      // (it's the one the app keeps regenerating and pushing on its own),
      // then whichever copy is actually confirmed synced to a real Google
      // event (so we never delete the one holding the real online link while
      // keeping an orphan that was never pushed), then the earliest created,
      // then the one with a time set.
      const isLinked = item => !!gcalLoc.current[item.tk.id];
      const keepRank = item => isHolidayish(item.tk) ? 0 : isLinked(item) ? 1 : 2;
      Object.values(groups).forEach(items => {
        if (items.length < 2) return;
        // Same name + same date alone is NOT enough to call two tasks
        // duplicates -- a recurring task's freshly-spawned next occurrence
        // can easily share both with an already-completed earlier one
        // without being the same thing at all. Require matching
        // done/cancelled state and type too.
        const sameShape = (a, b) => !!a.tk.done === !!b.tk.done && !!a.tk.cancelled === !!b.tk.cancelled && (a.tk.type || "regular") === (b.tk.type || "regular");
        // And never delete anything from this group at all unless at least
        // one member is a CONFIRMED, currently-synced copy (or an
        // app-generated holiday, which is safely regenerable either way) --
        // i.e. there's an actual Google Calendar event backing up the claim
        // that these are duplicates of one real thing, not just a
        // same-name-same-date coincidence between two genuinely separate
        // tasks.
        if (!items.some(it => isLinked(it) || isHolidayish(it.tk))) return;
        const anchor = [...items].sort((a, b) => {
          const ra = keepRank(a), rb = keepRank(b);
          if (ra !== rb) return ra - rb;
          const ca = a.tk.created || 0, cb = b.tk.created || 0;
          if (ca !== cb) return ca - cb;
          return (a.tk.time ? 0 : 1) - (b.tk.time ? 0 : 1);
        })[0];
        items.filter(it => it !== anchor && sameShape(it, anchor)).forEach(item => toDeleteIds.add(item.tk.id));
      });
      // Pass 1b: native holiday duplicates (hebcal/intl-generated) sharing
      // the same holiday name but landing on dates a day or two apart --
      // e.g. two separate Hebcal syncs disagreeing on which local date a
      // holiday starts on. Pass 1 above requires an EXACT date match, which
      // structurally can never catch this: it's specifically what's been
      // showing up as "the same holiday in a different week." These are
      // app-generated and safely regenerable, so it's fine to collapse them
      // by name alone within a small date window -- unlike Pass 1, no
      // Google link is required first, since there's nothing on Google to
      // corroborate against for a purely-local holiday task.
      //
      // Whatever gets dropped here is ALWAYS local-only (added to
      // localOnlyIds, declared early specifically for this): a wrong guess
      // about which of two local records is the "real" one must never be
      // allowed to delete an actual synced Google Calendar event. Worst
      // case if this picks wrong is a holiday task losing its local link
      // and getting re-pushed as new -- never data loss on Google's side.
      const localOnlyIds = new Set();
      const nativeHolidayItems = eligible.filter(item => item.tk.source !== "google" && (item.tk.hebcal || item.tk.intl) && !toDeleteIds.has(item.tk.id));
      const HOLIDAY_DATE_WINDOW_MS = 2 * 86400000;
      nativeHolidayItems.forEach(item => {
        if (toDeleteIds.has(item.tk.id)) return;
        const name = normHolidayName(item.tk.name) || normHolidayName(item.tk.nameEn);
        if (!name) return;
        const itemTime = new Date(item.tk.date + "T00:00:00").getTime();
        if (Number.isNaN(itemTime)) return;
        nativeHolidayItems.forEach(other => {
          if (other === item || toDeleteIds.has(other.tk.id) || toDeleteIds.has(item.tk.id)) return;
          const otherName = normHolidayName(other.tk.name) || normHolidayName(other.tk.nameEn);
          if (otherName !== name) return;
          if (!!item.tk.done !== !!other.tk.done || !!item.tk.cancelled !== !!other.tk.cancelled) return;
          const otherTime = new Date(other.tk.date + "T00:00:00").getTime();
          if (Number.isNaN(otherTime) || Math.abs(otherTime - itemTime) > HOLIDAY_DATE_WINDOW_MS) return;
          // Prefer keeping whichever copy is actually linked to a real
          // Google event (same priority Pass 1 uses), so a merge doesn't
          // needlessly orphan a working sync; fall back to the earlier-
          // created copy when neither (or both) are linked.
          const itemLinked = !!gcalLoc.current[item.tk.id], otherLinked = !!gcalLoc.current[other.tk.id];
          let keep;
          if (itemLinked !== otherLinked) keep = itemLinked ? item : other;
          else keep = (item.tk.created || 0) <= (other.tk.created || 0) ? item : other;
          const drop = keep === item ? other : item;
          toDeleteIds.add(drop.tk.id);
          localOnlyIds.add(drop.tk.id);
        });
      });
      // Pass 2: a foreign-imported task (from a subscribed Google holiday
      // calendar, say) that names the same holiday, on the same date, as a
      // native one this app already generates -- the exact scenario the
      // foreign-pull guard now prevents going forward, but pre-existing
      // pairs from before that fix need cleaning up here.
      const nativeHolidays = eligible.filter(item => item.tk.source !== "google" && isHolidayish(item.tk) && !toDeleteIds.has(item.tk.id));
      eligible.filter(item => item.tk.source === "google" && !toDeleteIds.has(item.tk.id)).forEach(item => {
        const names = [normHolidayName(item.tk.name), normHolidayName(item.tk.nameEn)].filter(Boolean);
        if (!names.length) return;
        const dupe = nativeHolidays.some(n => n.tk.date === item.tk.date && (names.includes(normHolidayName(n.tk.name)) || names.includes(normHolidayName(n.tk.nameEn))));
        if (dupe) toDeleteIds.add(item.tk.id);
      });
      // Pass 3: the same real appointment can show up as two separate local
      // "google" tasks when it's visible through more than one calendar --
      // e.g. an event you organize on a shared calendar also lands on your
      // own primary calendar as an attendee copy. pullForeign() now dedupes
      // this going forward (matching by the event's iCalUID), but pairs
      // created before that fix need a one-time local cleanup here. These are
      // genuine independent Google Calendar events, not ones TaskIt created,
      // so only the extra LOCAL copy is removed -- neither online event is
      // ever touched by this pass.
      const normEventKey = tk => (tk.name || "").trim().toLowerCase() + "|" + (tk.date || "") + "|" + (tk.time || "");
      const foreignGroups = {};
      eligible.filter(item => item.tk.source === "google" && !isHolidayish(item.tk) && !toDeleteIds.has(item.tk.id)).forEach(item => {
        const k = normEventKey(item.tk);

      });

        if (items.length < 2) return;

        // editable one) over a shared/attendee mirror; then just keep
        // whichever copy has been around the longest.

          const oa = a.tk.googleShared ? 1 : 0, ob = b.tk.googleShared ? 1 : 0;
          if (oa !== ob) return oa - ob;
          return (a.tk.created || 0) - (b.tk.created || 0);
        });
        sorted.slice(1).forEach(item => { toDeleteIds.add(item.tk.id); localOnlyIds.add(item.tk.id); });
      });
      // Pass 4: a "google"-sourced task whose googleEventId/googleCalendarId
      // is already claimed by some OTHER task (a native task already pushed
      // and linked to that same event, or a different foreign-imported copy
      // of it) is a duplicate of that one real Google event, not a second
      // real appointment -- e.g. a foreign import that got created for an
      // event this app had already pushed itself, right before its taskitId
      // marker became visible to the next pull. Keep whichever copy is
      // native (the authoritative one, if there is one) or otherwise
      // whichever has been around the longest; the extra copy is removed
      // locally only, since there's still just one real event on Google.
      const byGoogleEvent = {};

          if (na !== nb) return na - nb;
          return (a.tk.created || 0) - (b.tk.created || 0);

      // marker, but a freshly-created event can momentarily read back

      // foreign import is removed locally only.

          if (nativeMatch) { toDeleteIds.add(item.tk.id); localOnlyIds.add(item.tk.id); }

      const localDeleted = toDeleteIds.size;

        } catch (e) {

      const deletedTotal = localDeleted + remoteDeleted;
      setGcalScanMsg(he
        ? `נמחקו ${deletedTotal} כפילויות · הועלו ${uploaded} · נכשלו ${failed}`
        : `Deleted ${deletedTotal} duplicate${deletedTotal === 1 ? "" : "s"} · Uploaded ${uploaded} · Failed ${failed}`);
    } catch (e) {
      setGcalError(e.message || String(e));
    } finally {

    }
  };
