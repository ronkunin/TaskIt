  <script>
  // Deferred so this never delays first paint of the splash screen below.
  setTimeout(function(){
    // ── Draw app icon via canvas ──────────────────────────────────────────────
    function drawIcon(size) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const r = size * 0.18;
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.lineTo(size-r,0);
      ctx.quadraticCurveTo(size,0,size,r);
      ctx.lineTo(size,size-r);
      ctx.quadraticCurveTo(size,size,size-r,size);
      ctx.lineTo(r,size); ctx.quadraticCurveTo(0,size,0,size-r);
      ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0,0,size,size);
      grad.addColorStop(0,"#3B82F6"); grad.addColorStop(1,"#2563EB");
      ctx.fillStyle = grad; ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = size * 0.11;
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(size*0.22, size*0.52);
      ctx.lineTo(size*0.42, size*0.72);
      ctx.lineTo(size*0.78, size*0.30);
      ctx.stroke();
      return c.toDataURL("image/png");
    }

    const icon192 = drawIcon(192);
    const icon512 = drawIcon(512);

    // ── Inline Manifest ───────────────────────────────────────────────────────
    const manifest = {
      name: "TaskIt",
      short_name: "TaskIt",
      description: "Your personal task manager",
      start_url: "./",
      display: "standalone",
      background_color: "#F0F7FF",
      theme_color: "#3B82F6",
      orientation: "portrait",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png" },
        { src: icon512, sizes: "512x512", type: "image/png" }
      ]
    };
    const mBlob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    const mUrl  = URL.createObjectURL(mBlob);
    const mLink = document.createElement("link");
    mLink.rel = "manifest"; mLink.href = mUrl;
    document.head.appendChild(mLink);

    // Apple touch icon
    const touchLink = document.createElement("link");
    touchLink.rel = "apple-touch-icon"; touchLink.sizes = "180x180";
    touchLink.href = drawIcon(180);
    document.head.appendChild(touchLink);

    // Favicon
    const favLink = document.createElement("link");
    favLink.rel = "icon"; favLink.type = "image/png";
    favLink.href = drawIcon(32);
    document.head.appendChild(favLink);

  }, 0);
  </script>

  <div id="splash-copy-toast"></div>
  <script>(function(){
    var l=localStorage.getItem('taskflow_lang')||'he';
    var el=document.getElementById('html-splash-sub');
    if(el)el.textContent=l==='he'?'פשוט תעשה את זה!':'Just Task It.';
    // Logo click: copy task data as JSON emergency backup
    var logo=document.getElementById('splash-logo');
    var toast=document.getElementById('splash-copy-toast');
    var toastTimer=null;
    function showToast(msg){
      if(!toast)return;
      toast.textContent=msg;
      toast.style.opacity='1';
      clearTimeout(toastTimer);
      toastTimer=setTimeout(function(){toast.style.opacity='0';},2500);
    }
    if(logo){
      logo.addEventListener('click',function(){
        try{
          var tasks=JSON.parse(localStorage.getItem('taskflow_v5_main')||'[]');
          var archive=JSON.parse(localStorage.getItem('taskflow_v5_archive')||'[]');
          // Connected devices no longer keep a full local copy (Google holds it);
          // what's local is only the outbox of not-yet-synced changes.
          var outbox=JSON.parse(localStorage.getItem('taskflow_v6_outbox')||'null');
          if(!tasks.length&&outbox&&Array.isArray(outbox.tasks))tasks=outbox.tasks;
          var parsed={tasks:tasks,archive:archive,_exported:new Date().toISOString()};
          var json=JSON.stringify(parsed,null,2);
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(json).then(function(){
              showToast(l==='he'?'✅ הנתונים הועתקו!':'✅ Data copied!');
            }).catch(function(){
              // fallback
              var ta=document.createElement('textarea');
              ta.value=json;ta.style.position='fixed';ta.style.opacity='0';
              document.body.appendChild(ta);ta.select();
              document.execCommand('copy');document.body.removeChild(ta);
              showToast(l==='he'?'✅ הנתונים הועתקו!':'✅ Data copied!');
            });
          } else {
            var ta=document.createElement('textarea');
            ta.value=json;ta.style.position='fixed';ta.style.opacity='0';
            document.body.appendChild(ta);ta.select();
            document.execCommand('copy');document.body.removeChild(ta);
            showToast(l==='he'?'✅ הנתונים הועתקו!':'✅ Data copied!');
          }
        }catch(e){
          showToast(l==='he'?'⚠️ שגיאה בהעתקה':'⚠️ Copy failed');
        }
      });
    }
  })()</script>

const copyOrDownloadShareCanvas = async (canvas, filename) => {
  try {
    if (!(navigator.clipboard && window.ClipboardItem)) throw new Error("no-clipboard-api");

    await navigator.clipboard.write([new ClipboardItem({
      "image/png": blobPromise

  } catch (err) {
    try {
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();

    appToast(t("shareFailed"));

    return tasksRaw.every(tk => tk[key] === first) ? first : null;

  const commonTime = allSame("time");
  if (commonDate && commonTime) return `${fmtDate(commonDate)}  •  ${commonTime}`;
  if (commonDate) return fmtDate(commonDate);
  if (commonTime) return commonTime;
  const names = tasksRaw.map(tk => (taskDisplayName(tk) || "").trim());
  if (names.every(nm => nm && nm === names[0])) return names[0];

  const PAD = 36;
  const CW = W - PAD * 2;
  // Always the same light palette regardless of the person's own theme, so
  // the card reads identically wherever it ends up. Font weight never goes
  // above 750 anywhere in here.
  const INK = "#0B1220",
    INK2 = "#334155",
    INK3 = "#64748B",
    INK4 = "#94A3B8";
  const CARD = "#FFFFFF",
    LINE = "#E6EBF5";
  const VIOLET = "#7C3AED",
    INDIGO = "#4F46E5",
    BLUE = "#2563EB",
    SKY = "#0EA5E9",
    TEAL = "#0D9488",
    EMERALD = "#059669",
    AMBER = "#D97706",
    ROSE = "#E11D48",
    PINK = "#DB2777";
  const TYPE_PALETTE = [INDIGO, EMERALD, AMBER, PINK, SKY, VIOLET, TEAL, ROSE];
  const weekdayShort = isHe ? ["א", "ב", "ג", "ד", "ה", "ו", "ש"] : ["S", "M", "T", "W", "T", "F", "S"];
  const weekdayNames = isHe ? ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"] : ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const monthAbbr = isHe ? ["ינו", "פבר", "מרץ", "אפר", "מאי", "יונ", "יול", "אוג", "ספט", "אוק", "נוב", "דצמ"] : ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const monthLabel = e => e && e.m ? monthAbbr[e.m - 1] : e ? (() => {
    const [yy, q] = e.key.split("-");
    return `${q}'${yy.slice(2)}`;
  })() : "";
  const fmtD = ds => {
    if (!ds) return "";
    const [y, m, d] = ds.split("-");
    return `${d}/${m}/${y}`;
  };
  const taskLabel = tk => taskDisplayName(tk) || (isHe ? "ללא שם" : "Untitled");
  const nf = n => String(n);

  // ── layout engine: blocks stack vertically, each draws itself at its y ──
  const blocks = [];
  let h = 0;
  const push = (blockH, draw) => {
    blocks.push({ h: blockH, draw });
    h += blockH;
  };
  const startX = isHe ? W - PAD : PAD;
  const alignStart = isHe ? "right" : "left";
  const alignEnd = isHe ? "left" : "right";
  const endX = isHe ? PAD : W - PAD;
  const setDir = ctx => {
    ctx.direction = isHe ? "rtl" : "ltr";
    ctx.textAlign = alignStart;
  };
  // Panel = white rounded card with a hairline border and soft shadow.
  const panel = (ctx, x, y, w, ph, r = 18) => {
    ctx.save();
    ctx.shadowColor = "rgba(15,23,42,0.07)";
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 5;
    drawRoundedRectPath(ctx, x, y, w, ph, r);
    ctx.fillStyle = CARD;
    ctx.fill();
    ctx.restore();
    drawRoundedRectPath(ctx, x, y, w, ph, r);
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.stroke();
  };
  // Section heading: colored eyebrow rule + title + one-line "notice"
  const section = (eyebrow, title, notice, accent) => {
    push(notice ? 78 : 62, (ctx, y) => {
      setDir(ctx);
      ctx.textBaseline = "alphabetic";
      // accent rule
      const rw = 26;
      const rx = isHe ? startX - rw : startX;
      ctx.fillStyle = accent;
      drawRoundedRectPath(ctx, rx, y + 14, rw, 4, 2);
      ctx.fill();
      ctx.font = `700 10.5px ${FONT}`;
      ctx.fillStyle = accent;
      ctx.fillText(eyebrow.toUpperCase(), isHe ? startX - rw - 10 : startX + rw + 10, y + 20);
      ctx.font = `750 21px ${FONT}`;
      ctx.fillStyle = INK;
      ctx.fillText(title, startX, y + 46);
      if (notice) {
        ctx.font = `500 12.5px ${FONT}`;
        ctx.fillStyle = INK3;
        const lines = truncateCanvasLines(wrapCanvasText(ctx, notice, CW), 1);
        ctx.fillText(lines[0] || "", startX, y + 66);
      }
    });
  };

  // ══ 1. Brand strip ══
  push(66, (ctx, y) => {
    const B = 36, lx = PAD, cy = y + 4;
    const g = ctx.createLinearGradient(lx, cy, lx + B, cy + B);
    g.addColorStop(0, "#6366F1");
    g.addColorStop(1, "#2563EB");
    drawRoundedRectPath(ctx, lx, cy, B, B, 11);
    ctx.fillStyle = g;
    ctx.fill();
    const k = B * 0.5 / 24, ox = lx + B * 0.25, oy = cy + B * 0.25;
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2.8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(ox + 20 * k, oy + 6 * k);
    ctx.lineTo(ox + 9 * k, oy + 17 * k);
    ctx.lineTo(ox + 4 * k, oy + 12 * k);
    ctx.stroke();
    ctx.direction = "ltr";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = `750 21px ${FONT}`;
    ctx.fillStyle = INK;
    ctx.fillText("TaskIt", lx + B + 12, cy + B / 2 + 1);
    ctx.textAlign = "right";
    ctx.font = `500 12px ${FONT}`;
    ctx.fillStyle = INK4;
    ctx.fillText("Just Task It.", W - PAD, cy + B / 2 + 1);
  });

  // ══ 2. Hero headline ══
  push(126, (ctx, y) => {
    setDir(ctx);
    ctx.textBaseline = "alphabetic";
    ctx.font = `700 12px ${FONT}`;
    ctx.fillStyle = VIOLET;
    ctx.fillText("REWIND", startX, y + 16);
    ctx.font = `750 44px ${FONT}`;
    const grad = ctx.createLinearGradient(isHe ? W : 0, 0, isHe ? 0 : W, 0);
    grad.addColorStop(0, "#4F46E5");
    grad.addColorStop(0.55, "#7C3AED");
    grad.addColorStop(1, "#DB2777");
    ctx.fillStyle = grad;
    ctx.fillText(isHe ? "הסיפור שלך" : "Your story", startX, y + 60);
    // filter chip
    const chipText = subtitle || (isHe ? "הכול · כל הזמן" : "Everything · All time");
    ctx.font = `600 12.5px ${FONT}`;
    const tw = Math.min(ctx.measureText(chipText).width, CW - 40);
    const chipW = tw + 26, chipH = 28;
    const chipX = isHe ? startX - chipW : startX;
    drawRoundedRectPath(ctx, chipX, y + 74, chipW, chipH, 14);
    ctx.fillStyle = "#EEF2FF";
    ctx.fill();
    ctx.strokeStyle = "#C7D2FE";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = INDIGO;
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.fillText(chipText, chipX + chipW / 2, y + 74 + chipH / 2 + 1);
    // span note
    ctx.textBaseline = "alphabetic";
    setDir(ctx);
    ctx.font = `500 11.5px ${FONT}`;
    ctx.fillStyle = INK4;
    const span = stats.spanDays > 1
      ? (isHe ? `${stats.spanDays} ימים · ${stats.activeDays} ימים פעילים` : `${stats.spanDays} days · ${stats.activeDays} active days`)
      : new Date().toLocaleDateString(isHe ? "he-IL" : "en-US", { year: "numeric", month: "short", day: "numeric" });
    ctx.fillText(span, startX, y + 120);
  });

  // ══ 3. Hero total + completion ring ══
  push(184, (ctx, y) => {
    const ch = 168;
    ctx.save();
    ctx.shadowColor = "rgba(79,70,229,0.32)";
    ctx.shadowBlur = 26;
    ctx.shadowOffsetY = 10;
    drawRoundedRectPath(ctx, PAD, y, CW, ch, 24);
    const g = ctx.createLinearGradient(PAD, y, PAD + CW, y + ch);
    g.addColorStop(0, "#4F46E5");
    g.addColorStop(0.5, "#6D28D9");
    g.addColorStop(1, "#2563EB");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
    // decorative translucent circles
    ctx.save();
    drawRoundedRectPath(ctx, PAD, y, CW, ch, 24);
    ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    ctx.beginPath();
    ctx.arc(PAD + CW * 0.14, y + ch * 0.85, 96, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(PAD + CW * 0.88, y + 8, 70, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // ring on the trailing side
    const R = 56, RW = 12;
    const rx = isHe ? PAD + 96 : PAD + CW - 96, ry = y + ch / 2;
    ctx.beginPath();
    ctx.arc(rx, ry, R, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = RW;
    ctx.stroke();
    const pct = Math.max(0, Math.min(100, stats.completionRate));
    if (pct > 0) {
      ctx.beginPath();
      ctx.arc(rx, ry, R, -Math.PI / 2, -Math.PI / 2 + pct / 100 * Math.PI * 2);
      ctx.strokeStyle = "#A7F3D0";
      ctx.lineWidth = RW;
      ctx.lineCap = "round";
      ctx.stroke();
    }
    ctx.direction = "ltr";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `750 24px ${FONT}`;
    ctx.fillStyle = "#fff";
    ctx.fillText(pct + "%", rx, ry - 4);
    ctx.font = `600 10px ${FONT}`;
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillText((isHe ? "הושלם" : "done").toUpperCase(), rx, ry + 16);
    // big number
    setDir(ctx);
    ctx.textBaseline = "alphabetic";
    const tx = isHe ? W - PAD - 30 : PAD + 30;
    ctx.font = `750 74px ${FONT}`;
    ctx.fillStyle = "#fff";
    ctx.fillText(nf(stats.total), tx, y + 96);
    ctx.font = `700 15px ${FONT}`;
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillText(isHe ? "בסך הכול" : "all in", tx, y + 122);
    ctx.font = `500 12px ${FONT}`;
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    const sub = stats.totalMinutes > 0
      ? (isHe ? `${fmtRewindDuration(stats.totalMinutes)} של זמן מתוכנן` : `${fmtRewindDuration(stats.totalMinutes)} of planned time`)
      : (isHe ? `${stats.activeDays} ימים פעילים` : `across ${stats.activeDays} active days`);
    ctx.fillText(sub, tx, y + 142);
  });

  // ══ 4. Momentum — monthly line chart ══
  if (stats.byMonth.length > 1) {
    const peak = stats.busiestMonth;
    const notice = peak
      ? (isHe ? `השיא היה ${monthLabel(peak)} עם ${peak.count} · ${stats.avgPerMonth} בממוצע לחודש`
              : `Peaked in ${monthLabel(peak)} with ${peak.count} · ${stats.avgPerMonth} per month on average`)
      : null;
    section(isHe ? "מומנטום" : "Momentum", isHe ? "איך זה התפתח" : "How it unfolded", notice, INDIGO);
    push(250, (ctx, y) => {
      const ph = 236;
      panel(ctx, PAD, y, CW, ph, 20);
      const ip = 22;
      const plotX = PAD + ip, plotW = CW - ip * 2;
      const plotTop = y + 30, plotH = 150;
      const counts = stats.byMonth.map(m => m.count);
      const maxC = Math.max(...counts, 1);
      const n = counts.length;
      const px = i => plotX + (n === 1 ? plotW / 2 : i / (n - 1) * plotW);
      const py = c => plotTop + plotH - c / maxC * plotH;
      // horizontal gridlines + y labels
      ctx.direction = "ltr";
      ctx.textBaseline = "middle";
      for (let g = 0; g <= 2; g++) {
        const gy = plotTop + plotH - g / 2 * plotH;
        ctx.strokeStyle = g === 0 ? LINE : "#F1F5F9";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(plotX, gy);
        ctx.lineTo(plotX + plotW, gy);
        ctx.stroke();
        ctx.font = `600 9.5px ${FONT}`;
        ctx.fillStyle = INK4;
        ctx.textAlign = isHe ? "left" : "right";
        ctx.fillText(nf(Math.round(maxC * g / 2)), isHe ? plotX + plotW + 16 : plotX - 8, gy);
      }
      // area
      ctx.beginPath();
      ctx.moveTo(px(0), py(counts[0]));
      counts.forEach((c, i) => { if (i > 0) ctx.lineTo(px(i), py(c)); });
      ctx.lineTo(px(n - 1), plotTop + plotH);
      ctx.lineTo(px(0), plotTop + plotH);
      ctx.closePath();
      const ag = ctx.createLinearGradient(0, plotTop, 0, plotTop + plotH);
      ag.addColorStop(0, "rgba(99,102,241,0.34)");
      ag.addColorStop(1, "rgba(99,102,241,0.02)");
      ctx.fillStyle = ag;
      ctx.fill();
      // line
      ctx.beginPath();
      counts.forEach((c, i) => { i === 0 ? ctx.moveTo(px(i), py(c)) : ctx.lineTo(px(i), py(c)); });
      const lg = ctx.createLinearGradient(plotX, 0, plotX + plotW, 0);
      lg.addColorStop(0, "#4F46E5");
      lg.addColorStop(1, "#DB2777");
      ctx.strokeStyle = lg;
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();
      // dots + peak callout
      const peakI = counts.indexOf(maxC);
      counts.forEach((c, i) => {
        const isPk = i === peakI;
        ctx.beginPath();
        ctx.arc(px(i), py(c), isPk ? 5.5 : 3.5, 0, Math.PI * 2);
        ctx.fillStyle = isPk ? "#DB2777" : "#fff";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = isPk ? "#DB2777" : INDIGO;
        ctx.stroke();
      });
      if (maxC > 0) {
        const bx = px(peakI), by = py(maxC) - 26;
        ctx.font = `700 11px ${FONT}`;
        const lw = ctx.measureText(nf(maxC)).width + 18;
        const bxc = Math.max(plotX, Math.min(bx - lw / 2, plotX + plotW - lw));
        drawRoundedRectPath(ctx, bxc, by, lw, 20, 10);
        ctx.fillStyle = "#DB2777";
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(nf(maxC), bxc + lw / 2, by + 11);
      }
      // x labels
      ctx.font = `600 10px ${FONT}`;
      ctx.fillStyle = INK4;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      const step = Math.max(1, Math.ceil(36 * (n - 1) / Math.max(plotW, 1)));
      for (let i = 0; i < n; i += step) ctx.fillText(monthLabel(stats.byMonth[i]), px(i), plotTop + plotH + 20);
      if ((n - 1) % step !== 0) ctx.fillText(monthLabel(stats.byMonth[n - 1]), px(n - 1), plotTop + plotH + 20);
      // footer strip inside panel
      ctx.textAlign = isHe ? "right" : "left";
      ctx.direction = isHe ? "rtl" : "ltr";
      ctx.font = `600 11px ${FONT}`;
      ctx.fillStyle = INK3;
      ctx.fillText(isHe ? `${stats.byMonth.length} תקופות` : `${stats.byMonth.length} periods tracked`, isHe ? PAD + CW - ip : PAD + ip, y + ph - 14);
    });
  }

  // ══ 5. The split — donut ══
  {
    const notice = stats.completedCount >= stats.cancelledCount
      ? (isHe ? `${stats.completionRate}% מהכול הגיע לקו הסיום` : `${stats.completionRate}% of everything made it to the finish line`)
      : (isHe ? "רוב הדברים לא הושלמו — אולי הגיע הזמן לנקות" : "More was dropped than finished — worth a cleanup");
    section(isHe ? "החלוקה" : "The split", isHe ? "איך זה נגמר" : "How it ended up", notice, EMERALD);
    push(212, (ctx, y) => {
      const ph = 198;
      panel(ctx, PAD, y, CW, ph, 20);
      const segs = [
        { label: isHe ? "ממתין" : "Pending", value: stats.pendingCount, c: BLUE },
        { label: isHe ? "הושלם" : "Completed", value: stats.completedCount, c: EMERALD },
        { label: isHe ? "בוטל" : "Cancelled", value: stats.cancelledCount, c: ROSE }
      ].filter(s => s.value > 0);
      const total = segs.reduce((s, x) => s + x.value, 0) || 1;
      const R = 66, RI = 42;
      const cx = isHe ? PAD + CW - 26 - R : PAD + 26 + R, cyc = y + ph / 2;
      ctx.direction = "ltr";
      let cum = -Math.PI / 2;
      if (segs.length === 1) {
        ctx.beginPath();
        ctx.arc(cx, cyc, (R + RI) / 2, 0, Math.PI * 2);
        ctx.strokeStyle = segs[0].c;
        ctx.lineWidth = R - RI;
        ctx.stroke();
      } else {
        segs.forEach(s => {
          const a = s.value / total * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(cx, cyc, R, cum, cum + a);
          ctx.arc(cx, cyc, RI, cum + a, cum, true);
          ctx.closePath();
          ctx.fillStyle = s.c;
          ctx.fill();
          // thin white separator
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.stroke();
          cum += a;
        });
      }
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `750 26px ${FONT}`;
      ctx.fillStyle = INK;
      ctx.fillText(nf(stats.total), cx, cyc - 6);
      ctx.font = `600 10px ${FONT}`;
      ctx.fillStyle = INK4;
      ctx.fillText((isHe ? "סה״כ" : "total").toUpperCase(), cx, cyc + 14);
      // legend rows
      const legW = CW - R * 2 - 92;
      const legX = isHe ? PAD + 26 : PAD + CW - 26 - legW;
      ctx.textBaseline = "alphabetic";
      segs.forEach((s, i) => {
        const ly = y + 56 + i * 44;
        const rowY = ly - 12;
        drawRoundedRectPath(ctx, legX, rowY, legW, 34, 10);
        ctx.fillStyle = "#F8FAFC";
        ctx.fill();
        const dotX = isHe ? legX + legW - 16 : legX + 16;
        ctx.beginPath();
        ctx.arc(dotX, rowY + 17, 5, 0, Math.PI * 2);
        ctx.fillStyle = s.c;
        ctx.fill();
        ctx.direction = isHe ? "rtl" : "ltr";
        ctx.textAlign = isHe ? "right" : "left";
        ctx.font = `600 12.5px ${FONT}`;
        ctx.fillStyle = INK;
        ctx.fillText(s.label, isHe ? dotX - 12 : dotX + 12, rowY + 22);
        ctx.direction = "ltr";
        ctx.textAlign = isHe ? "left" : "right";
        ctx.font = `700 12.5px ${FONT}`;
        ctx.fillStyle = s.c;
        ctx.fillText(`${s.value} · ${Math.round(s.value / total * 100)}%`, isHe ? legX + 14 : legX + legW - 14, rowY + 22);
      });
    });
  }

  // ══ 6. Where it went — type bars ══
  // Only worth showing when there's real spread across categories. If one
  // type dominates, or the top two between them already cover almost
  // everything, a "by category" chart has nothing interesting to say.
  const typeTotal = stats.typeEntries.reduce((s, e) => s + e[1], 0) || 1;
  const top1Share = stats.typeEntries.length ? stats.typeEntries[0][1] / typeTotal : 0;
  const top2Share = stats.typeEntries.length ? (stats.typeEntries[0][1] + (stats.typeEntries[1] ? stats.typeEntries[1][1] : 0)) / typeTotal : 0;
  const showTypeChart = stats.typeEntries.length >= 3 && top1Share < 0.6 && top2Share < 0.85;
  if (showTypeChart) {
    const shown = stats.typeEntries.slice(0, 6);
    const maxT = shown[0][1] || 1;
    const rowH = 38;
    const ph = 26 + shown.length * rowH;
    const top = stats.typeEntries[0];
    const notice = isHe
      ? `“${getTypeMeta(top[0]).label}” הוביל עם ${top[1]} מתוך ${stats.typeEntries.length} סוגים`
      : `"${getTypeMeta(top[0]).label}" led the way with ${top[1]} of ${stats.total}`;
    section(isHe ? "לאן זה הלך" : "Where it went", isHe ? "לפי סוג" : "By category", notice, AMBER);
    push(ph + 14, (ctx, y) => {
      panel(ctx, PAD, y, CW, ph, 20);
      const ip = 22;
      const labelW = 118;
      const barX = isHe ? PAD + ip : PAD + ip + labelW;
      const barMaxW = CW - ip * 2 - labelW - 54;
      shown.forEach((e, i) => {
        const [ty, count] = e;
        const ry = y + 22 + i * rowH;
        const c = TYPE_PALETTE[i % TYPE_PALETTE.length];
        ctx.direction = isHe ? "rtl" : "ltr";
        ctx.textAlign = isHe ? "right" : "left";
        ctx.textBaseline = "middle";
        ctx.font = `600 12.5px ${FONT}`;
        ctx.fillStyle = INK;
        const lbl = truncateCanvasLines(wrapCanvasText(ctx, getTypeMeta(ty).label, labelW - 12), 1)[0] || "";
        ctx.fillText(lbl, isHe ? PAD + CW - ip : PAD + ip, ry + 10);
        // track
        const bw = Math.max(4, count / maxT * barMaxW);
        const bx = isHe ? PAD + CW - ip - labelW - barMaxW : barX;
        drawRoundedRectPath(ctx, bx, ry + 2, barMaxW, 16, 8);
        ctx.fillStyle = "#F1F5F9";
        ctx.fill();
        const fx = isHe ? bx + barMaxW - bw : bx;
        drawRoundedRectPath(ctx, fx, ry + 2, bw, 16, 8);
        const bg2 = ctx.createLinearGradient(fx, 0, fx + bw, 0);
        bg2.addColorStop(0, c);
        bg2.addColorStop(1, c + "BB");
        ctx.fillStyle = bg2;
        ctx.fill();
        ctx.direction = "ltr";
        ctx.textAlign = isHe ? "left" : "right";
        ctx.font = `700 12px ${FONT}`;
        ctx.fillStyle = c;
        ctx.fillText(nf(count), isHe ? PAD + ip : PAD + CW - ip, ry + 10);
      });
    });
  }

  // ══ 7. Rhythm — weekday bars ══
  if (stats.bestWeekday) {
    const notice = isHe
      ? `${weekdayNames[stats.bestWeekday.idx]} הוא היום החזק שלך${stats.quietWeekday ? `, ${weekdayNames[stats.quietWeekday.idx]} הכי שקט` : ""}`
      : `${weekdayNames[stats.bestWeekday.idx]} is your strongest day${stats.quietWeekday ? `, ${weekdayNames[stats.quietWeekday.idx]} your quietest` : ""}`;
    section(isHe ? "קצב" : "Rhythm", isHe ? "לפי יום בשבוע" : "By day of the week", notice, SKY);
    push(186, (ctx, y) => {
      const ph = 172;
      panel(ctx, PAD, y, CW, ph, 20);
      const ip = 26;
      const maxW2 = Math.max(...stats.byWeekday, 1);
      const cols = 7;
      const gap = 12;
      const colW = (CW - ip * 2 - gap * (cols - 1)) / cols;
      const baseY = y + ph - 42;
      const maxBarH = 96;
      stats.byWeekday.forEach((c, i) => {

  //  - no date at all -> no reminder (nothing to anchor it to)
  //  - a holiday -> 9:00 AM the same day
  //  - repeats once a year, not a holiday -> 9:00 AM the day before
  //  - repeats on any other cadence -> right at the moment it happens
  //  - one-off (no repeat) with a clock time -> 30 minutes before
  //  - one-off (no repeat), no clock time -> 9:00 AM the same day
  // Because this lives in taskSignature too (not just taskToEventBody),
  // re-evaluating it always keeps signature and push in lockstep: a task
  // moving between timed and date-only, gaining or losing a repeat, or
  // having its date changed (by any means -- the edit form, drag-and-drop,
  // whatever) changes the resolved reminder, which changes the signature,
  // which is exactly what tells the push effect there's something new to
  // send. The same mechanism means every already-synced task picks up
  // whatever the current rules say next time a push runs, with no separate
  // migration needed.
  function resolveReminderMinutes(t) {
    if (isDateless(t)) return null; // no real date to anchor a reminder to, no exceptions
    if (t.reminderMinutes === "none") return null; // explicit opt-out
    if (t.reminderMinutes != null && t.reminderMinutes !== "") {
      const n = Number(t.reminderMinutes);
      if (Number.isFinite(n)) return n; // explicit override, in minutes-before
    }
    const nt = normTime(t.time);
    const timeMin = nt ? (() => {
      const [h, m] = nt.split(":").map(Number);
      return h * 60 + m;
    })() : null;
    // "N days before, at 9:00 AM": for a task with a clock time this counts
    // back from that exact moment; for a date-only task (an "all-day" event
    // on Google's side) it counts back from the END of its day instead
    // (Google's own reminder anchor for all-day events), so N=0 still lands
    // on 9:00 AM that same day rather than at midnight.
    const daysBeforeAt9 = days => timeMin != null ? days * 1440 + (timeMin - 9 * 60) : (days + 1) * 1440 - 9 * 60;
    if (isHolidayTask(t)) return daysBeforeAt9(0);
    if (isRecurring(t)) {
      if (t.recur === "year") return daysBeforeAt9(1); // once a year, not a holiday: a day's notice
      // Any other repeat cadence: right at the moment it happens. For a
      // date-only task that "moment" is its literal start (00:00 that day
      // per Google's own all-day semantics) -- under the end-of-day anchor
      // above that's a full 1440 minutes before it, not 0 (0 would instead
      // land at the very end of the day).
      return timeMin != null ? 0 : 1440;
    }
    // One-off, no repeat: the usual half hour of notice before a clock time,
    // or 9:00 AM the same day when there isn't one.
    return timeMin != null ? 30 : daysBeforeAt9(0);
  }
  function taskSignature(t) {
    return JSON.stringify([
      String(t.name || ""), String(t.note || ""), String(t.type || ""),
      String(t.date || ""), normTime(t.time) || "",
      t.length == null ? "" : String(t.length),
      t.recur == null ? "" : String(t.recur),
      t.recurUntil || "",
      resolveReminderMinutes(t),
      t.done ? 1 : 0, t.cancelled ? 1 : 0
    ]);
  }

  function taskToEventBody(task) {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    const prefix = task.done ? "✔ " : task.cancelled ? "✖ " : "";
    const body = {
      summary: (prefix + String(task.name || "")).slice(0, 1000),
      // null, not undefined: undefined keys are dropped by JSON.stringify, which
      // would leave a stale old note on the Google event forever once the local
      // note is cleared. null is a real value and actually clears it.
      description: task.note ? String(task.note).slice(0, 7000) : null,
      extendedProperties: {
        private: {
          taskitId: String(task.id),
          type: String(task.type || ""),
          recur: task.recur == null ? "" : String(task.recur),
          recurUntil: task.recurUntil || "",
          seriesId: String(task.seriesId || ""),
          done: task.done ? "1" : "0",
          cancelled: task.cancelled ? "1" : "0",
          length: task.length == null ? "" : String(task.length),
          noDate: isDateless(task) ? "1" : "0",
          // Round-tripped so a device that pulls one of these back — before it has
          // regenerated the same holiday locally itself — reconstructs a proper
          // holiday task instead of a generic one that then shows an incongruous
          // delete button and loses its English name.
          hebcal: task.hebcal ? "1" : "0",
          intl: task.intl ? "1" : "0",
          nameEn: task.nameEn ? String(task.nameEn).slice(0, 300) : "",
          reminderMinutes: task.reminderMinutes == null || task.reminderMinutes === "" ? "" : String(task.reminderMinutes),
          sig: taskSignature(task).slice(0, 1000)
        }
      }
    };
    // Explicit either way, same reasoning as transparency below: a task with
    // no reminder set has to actively clear Google's reminders (an empty
    // overrides array, not useDefault) or a task that previously had one
    // would keep ringing after the person removed it in TaskIt, since a
    // PATCH that omits the field leaves Google's existing value alone.
    const remMin = resolveReminderMinutes(task);
    body.reminders = remMin != null ? {
      useDefault: false,
      overrides: [{
        method: "popup",
        minutes: remMin
      }]
    } : {
      useDefault: false,
      overrides: []
    };
    // Explicit either way, never left unset: transparency is exactly as prone to
    // staleness as start/end above. A holiday or dateless task syncs as
    // "transparent" (free); if it's only set in that branch and simply omitted
    // otherwise, a task that later gets a real date/time keeps showing as
    // transparent/free forever, since a PATCH that doesn't mention the field
    // leaves Google's existing value untouched.
    body.transparency = (isHolidayTask(task) || isDateless(task)) ? "transparent" : "opaque";
    // Google's PATCH endpoint merges the *sub-fields* of start/end rather than
    // replacing the object wholesale: if an event was previously all-day (start =
    // {date}) and we PATCH in start = {dateTime, timeZone} without also clearing
    // "date", Google keeps the old "date" around alongside the new "dateTime" and
    // rejects the event as invalid (a start can't have both). Sending the unused
    // key explicitly as null clears it, which is the documented way to drop a
    // field in a Google API patch. Every branch below sets all three of
    // date/dateTime/timeZone, explicitly nulling whichever two don't apply, so a
    // task can freely move between dateless, all-day and timed without leaving a
    // stale field behind for Google to choke on.
    if (isDateless(task)) {
      body.start = { date: ANCHOR_DATE, dateTime: null, timeZone: null };
      body.end = { date: ANCHOR_END, dateTime: null, timeZone: null };
      return body;
    }
    // A multi-day (finishDate) task spans from its start date through its
    // finish date -- without this, it would push as a single-day event on
    // Google, silently losing the span entirely.
    if (isMultiDay(task)) {
      const time = normTime(task.time);
      if (time) {
        const startLocal = `${task.date}T${time}:00`;
        const mins = Number(task.length) > 0 ? Number(task.length) : DEFAULT_TASK_LENGTH;
        // Measured from the FINISH date's own start time, not the start
        // date's -- day 1's start clock time through day N's
        // start-time-plus-length, not day 1's alone.
        const end = new Date(new Date(`${task.finishDate}T${time}:00`).getTime() + mins * 60000);
        body.start = { dateTime: startLocal, timeZone: tz, date: null };
        body.end = { dateTime: `${localDs(end)}T${pad2(end.getHours())}:${pad2(end.getMinutes())}:00`, timeZone: tz, date: null };
      } else {
        const endD = new Date(task.finishDate + "T00:00:00");
        endD.setDate(endD.getDate() + 1); // Google's all-day end date is exclusive
        body.start = { date: task.date, dateTime: null, timeZone: null };
        body.end = { date: localDs(endD), dateTime: null, timeZone: null };
      }
      return body;
    }
    const time = normTime(task.time);
    if (time) {
      // Previously this wrote the UTC clock time but labelled it with the local time
      // zone, so every timed task drifted by the UTC offset each time it round-tripped.
      // Send the local wall-clock time and let timeZone mean what it says.
      const startLocal = `${task.date}T${time}:00`;
      // Same default the week grid draws an unset length with (1h), so the event
      // in Google is the size it looks like here.
      const mins = Number(task.length) > 0 ? Number(task.length) : DEFAULT_TASK_LENGTH;
      const end = new Date(new Date(startLocal).getTime() + mins * 60000);
      body.start = { dateTime: startLocal, timeZone: tz, date: null };
      body.end = { dateTime: `${localDs(end)}T${pad2(end.getHours())}:${pad2(end.getMinutes())}:00`, timeZone: tz, date: null };
    } else {
      const d = new Date(task.date + "T00:00:00");
      const next = new Date(d); next.setDate(next.getDate() + 1);
      body.start = { date: task.date, dateTime: null, timeZone: null };
      body.end = { date: localDs(next), dateTime: null, timeZone: null };
    }
    return body;
  }

  function eventToTaskPatch(event) {
    const p = event.extendedProperties?.private || {};
    const patch = {
      name: event.summary ? event.summary.replace(/^(✔|✖)\s*/, "") : "",
      note: event.description || null,
      type: p.type || "regular",
      recur: p.recur ? (isNaN(parseInt(p.recur)) ? p.recur : parseInt(p.recur)) : null,
      done: p.done === "1",
      cancelled: p.cancelled === "1",
      length: p.length ? Number(p.length) : null,
      updated: event.updated ? new Date(event.updated).getTime() : Date.now()
    };
    if (p.seriesId) patch.seriesId = p.seriesId;
    if (p.recurUntil) patch.recurUntil = p.recurUntil;
    if (p.hebcal === "1") patch.hebcal = true;
    if (p.intl === "1") patch.intl = true;
    if (p.nameEn) patch.nameEn = p.nameEn;
    if (p.noDate === "1") { patch.date = ""; patch.time = ""; return patch; }
    if (event.start?.dateTime) {
      const d = new Date(event.start.dateTime);
      patch.date = localDs(d);
      patch.time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    } else if (event.start?.date) {
      patch.date = event.start.date;
      patch.time = "";
    }
    return patch;
  }

  const remoteSigOf = event => event.extendedProperties?.private?.sig || null;

  // Compares an already-pulled Google event's *visible* fields against the
  // canonical body this task would produce — ignoring the stored "sig" extended
  // property, which is invisible in Google Calendar's own UI. A manual edit
  // there (rename, redate, add a note, add a time) never touches that property,
  // so trusting it alone would call a drifted event "in sync" forever. This is
  // what lets a pull actually notice the drift so it can be corrected. Only the
  // presence of a time is compared, not its exact string, since Google returns
  // dateTime with a timezone offset appended and a byte-for-byte match isn't
  // the point — whether it's still date-only vs. timed is.
  function eventMatchesTask(event, task) {
    const body = taskToEventBody(task);
    if ((event.summary || "") !== body.summary) return false;
    if ((event.description || null) !== (body.description == null ? null : body.description)) return false;
    if ((event.start?.date || null) !== (body.start.date || null)) return false;
    if (!!event.start?.dateTime !== !!body.start.dateTime) return false;
    if ((event.end?.date || null) !== (body.end.date || null)) return false;
    if (!!event.end?.dateTime !== !!body.end.dateTime) return false;
    if ((event.transparency || "opaque") !== body.transparency) return false;
    return true;
  }

  // ── Push ──────────────────────────────────────────────────────────────────
  // knownLoc, when given, is the calendar id the caller last saw this task's event
  // sitting in (from a real pull, not a guess). It decides two things: whether an
  // update should be attempted before an insert, and whether a cleanup delete runs
  // afterward. Because the id is derived from the task, all of this is idempotent —
  // running it twice, on two devices, at the same time, converges on one event.
  //
  // Known location → update first (the common case: editing a task you've already
  // synced). No known location → insert first instead of update-first. Genuinely
  // new tasks are far more common in bulk than moved ones, and update-first would
  // mean a guaranteed failed request for every single one of them before the real
  // insert — exactly what turned enabling holiday sync into a hundred red lines in
  // the console the first time it imports a year of holidays. Insert-first makes
  // that a hundred plain successes instead.
  async function pushTask(task, knownLoc) {
    const skip = syncSkipReason(task);
    if (skip) return { skipped: skip };
    const calendarId = await ensureCalendarId(task);
    const eventId = eventIdForTask(task.id);
    const body = taskToEventBody(task);
    const doUpdate = () => apiFetch(`/calendars/${enc(calendarId)}/events/${eventId}`, {
      method: "PATCH", body: JSON.stringify({ ...body, status: "confirmed" })
    });
    const doInsert = () => apiFetch(`/calendars/${enc(calendarId)}/events`, {
      method: "POST", body: JSON.stringify({ ...body, id: eventId })
    });
    let event;
    if (knownLoc === calendarId) {
      try {
        event = await doUpdate();
      } catch (e) {
        if (e.status !== 404 && e.status !== 410) throw e;
        try { event = await doInsert(); }
        catch (e2) { if (e2.status !== 409) throw e2; event = await doUpdate(); }
      }
    } else {
      try {
        event = await doInsert();
      } catch (e) {
        if (e.status !== 409) throw e;
        // id already taken here (usually a previously deleted event, or the task
        // moved calendars and we're seeing it for the first time) — revive it.
        event = await doUpdate();
      }
    }
    // Only clean up a location we actually know held this task (a real type change),
    // never a blind sweep of every calendar we happen to know about.
    if (knownLoc && knownLoc !== calendarId) {
      await apiFetch(`/calendars/${enc(knownLoc)}/events/${eventId}`, { method: "DELETE" }).catch(() => {});
    }
    return { googleEventId: event.id, calendarId, sig: taskSignature(task) };
  }

  async function deleteTask(taskId, knownLoc) {
    const eventId = eventIdForTask(taskId);
    // Same principle as pushTask: delete from the one place we know it lives. Fall
    // back to every calendar only if we truly have no record of where it is (e.g.
    // deleting a task the same session it was created, before any pull ran).
    // "Not there" (404/410) counts as done. Anything else -- above all a
    // network failure while offline -- is rethrown now, instead of being
    // swallowed, so the caller can keep the deletion in the outbox and retry;
    // a silently-lost delete is how a deleted task came back on the next pull.
    const gone = e => { if (e && (e.status === 404 || e.status === 410)) return; throw e; };
    if (knownLoc) {
      await apiFetch(`/calendars/${enc(knownLoc)}/events/${eventId}`, { method: "DELETE" }).catch(gone);
      return;
    }
    const ids = await getAllCalendarIds();
    let firstErr = null;
    for (const cid of ids) {
      await apiFetch(`/calendars/${enc(cid)}/events/${eventId}`, { method: "DELETE" }).catch(gone).catch(e => { firstErr = firstErr || e; });
    }
    if (firstErr) throw firstErr;
  }

  // ── Pull ──────────────────────────────────────────────────────────────────
  // No syncToken. A sync token is per-device incremental state with a short shelf
  // life; when it expires Google answers 410 (those were the 410s in the console)
  // and the old code quietly returned an empty list, so that calendar looked empty
  // until some later pass. A plain windowed list is a little more traffic and is
  // identical on every device, every time.
  //
  // Reads every physical TaskIt calendar (getAllCalendarIds), not just one per name —
  // a task sitting in a non-canonical duplicate calendar must still be found, or it
  // would look deleted the moment "complete" pulls started trusting their own result.
  async function pullAll() {
    const raw = (await listAllRaw(true));
    const events = [];
    let complete = true;
    for (const { id: calendarId, type } of raw) {
      let pageToken = null, guard = 0;
      try {
        do {
          const params = new URLSearchParams({ maxResults: "250", showDeleted: "false" });
          // No time window any more: with no full local copy, Google is the only
          // place a task lives, so anything outside a window would simply vanish
          // from the app (it used to only survive in the local cache).
          if (pageToken) params.set("pageToken", pageToken);
          const res = await apiFetch(`/calendars/${enc(calendarId)}/events?${params}`);
          for (const ev of res?.items || []) {
            if (ev.status === "cancelled") continue;
            if (!ev.extendedProperties?.private?.taskitId) continue;
            events.push({ calendarId, type, event: ev });
          }
          pageToken = res?.nextPageToken || null;
        } while (pageToken && ++guard < 200);
        // Stopped by the page guard with pages still left: that's a partial
        // read, and must not be mistaken for a complete one (which is allowed
        // to conclude "missing = deleted elsewhere").
        if (pageToken) complete = false;
      } catch (e) {
        complete = false; // never let a partial read look like "these tasks are gone"
      }
    }
    return { events, calendars: raw.length, complete };
  }

  // ── Repair ────────────────────────────────────────────────────────────────
  // Collapses every duplicate of a task down to the one canonical event, across
  // every physical TaskIt calendar (not just one per name), migrates legacy
  // randomly-named events onto the deterministic id, and — new — folds duplicate
  // calendars that share a name back down to one, deleting the emptied copies. That
  // last part is what actually shrinks a Google Calendar sidebar that has ended up
  // with several "TaskIt · work"-looking entries.
  async function reconcileAndDedupe() {
    const { events, complete } = await pullAll();
    if (!complete) throw Object.assign(new Error("Could not read every calendar — nothing was deleted"), { status: 0 });
    const canonical = await getCalendars(true); // type -> one chosen id

    const byTid = {};
    for (const rec of events) {
      const tid = rec.event.extendedProperties.private.taskitId;
      (byTid[tid] = byTid[tid] || []).push(rec);
    }
    let removed = 0, migrated = 0;
    for (const [tid, recs] of Object.entries(byTid)) {
      const want = eventIdForTask(tid);
      const home = canonical[recs[0].type] || recs[0].calendarId;
      if (recs.length === 1 && recs[0].event.id === want && recs[0].calendarId === home) continue;
      recs.sort((a, b) => new Date(b.event.updated) - new Date(a.event.updated));
      // Prefer a copy that is already in the canonical calendar for its type, so
      // consolidation doesn't need to move data whenever it can avoid it.
      let keep = recs.find(r => r.calendarId === home && r.event.id === want)
        || recs.find(r => r.calendarId === home)
        || null;
      if (!keep) {
        const src = recs[0];
        const copy = {
          id: want,
          summary: src.event.summary,
          description: src.event.description,
          start: src.event.start,
          end: src.event.end,
          extendedProperties: src.event.extendedProperties
        };
        try {
          const ev = await apiFetch(`/calendars/${enc(home)}/events`, { method: "POST", body: JSON.stringify(copy) });
          keep = { calendarId: home, event: ev };
          migrated++;
        } catch (e) {
          if (e.status !== 409) continue; // leave it alone rather than risk losing it
          const ev = await apiFetch(`/calendars/${enc(home)}/events/${want}`, { method: "PATCH", body: JSON.stringify({ ...copy, status: "confirmed" }) });
          keep = { calendarId: home, event: ev };
          migrated++;
        }
      }
      for (const r of recs) {
        if (r.event.id === keep.event.id && r.calendarId === keep.calendarId) continue;
        await apiFetch(`/calendars/${enc(r.calendarId)}/events/${r.event.id}`, { method: "DELETE" }).catch(() => {});
        removed++;
      }
    }

    // Fold duplicate calendars: any non-canonical "TaskIt · X" calendar should now
    // hold nothing of ours (everything above was moved to the canonical copy). Check
    // each one and delete it if it's genuinely empty, so the sidebar clutter this
    // created actually goes away instead of sitting there forever as an empty shell.
    let calendarsRemoved = 0;
    const raw = await listAllRaw(true);
    for (const { id, type } of raw) {
      if (id === canonical[type]) continue;
      try {
        const check = await apiFetch(`/calendars/${enc(id)}/events?maxResults=1&showDeleted=false`);
        if ((check?.items || []).length === 0) {
          await apiFetch(`/calendars/${enc(id)}`, { method: "DELETE" });
          calendarsRemoved++;
        }
      } catch { /* leave it — better a harmless leftover calendar than data loss */ }
    }
    if (calendarsRemoved) { calRaw = null; calMap = null; } // force a fresh read next time

    return { removedCount: removed, migratedCount: migrated, calendarsRemoved };
  }

  // ── Foreign (non-TaskIt) calendars & events ─────────────────────────────
  // "Foreign" means any calendar that is not one of our own "TaskIt · X"
  // calendars: the user's primary calendar, any other calendar they own, and
  // any calendar someone else has shared with them. Reading these is entirely
  // opt-in (the "Google Events" toggle) and lives on its own — foreign events
  // are never written into a TaskIt calendar, and TaskIt tasks are never
  // written into a foreign one.
  async function listForeignCalendars(force) {
    if (foreignCalRaw && !force && Date.now() - foreignCalAt < 300000) return foreignCalRaw;
    const list = await apiFetch("/users/me/calendarList?maxResults=250");
    const raw = [];
    for (const c of list?.items || []) {
      if (c.summary && c.summary.startsWith(CAL_PREFIX)) continue; // ours, handled above
      if (c.deleted) continue;
      // A calendar the user did not add themselves (holidays-in-X, birthdays,
      // etc. that Google subscribes everyone to) still comes back as "reader"
      // and would flood the list with entries nobody asked to import — skip
      // anything whose id looks like one of Google's own public feeds.
      if (/^[a-z_]+#(holiday|weeknum)@group\.v\.calendar\.google\.com$/.test(c.id)) continue;
      if (c.id === "addressbook#contacts@group.v.calendar.google.com") continue;
      raw.push({ id: c.id, summary: c.summary || c.id, accessRole: c.accessRole || "reader", primary: !!c.primary });
    }
    foreignCalRaw = raw;
    foreignCalAt = Date.now();
    return raw;
  }

  // A stable per-event local task id, independent of TaskIt's uid() scheme, so
  // the same foreign event always maps back to the same local task on every
  // device and every pull, with no lookup table to keep in sync.
  function foreignTaskId(calendarId, eventId) {
    const raw = calendarId + "::" + eventId;
    const bytes = new TextEncoder().encode(raw);
    let hex = "";
    for (const b of bytes) hex += b.toString(16).padStart(2, "0");
    if (hex.length > 60) hex = hex.slice(0, 60);
    return "gf" + hex;
  }

  const roundLengthToQuarter = mins => Math.max(15, Math.round(mins / 15) * 15);

  function foreignEventToTask(calendarId, calSummary, shared, event) {
    const untitled = getLang() === "he" ? "(ללא כותרת)" : "(untitled)";
    const mark = splitStatusMark(event.summary);
    const patch = {
      id: foreignTaskId(calendarId, event.id),
      name: mark.name || untitled,
      note: event.description || null,
      type: "google",
      source: "google",
      googleCalendarId: calendarId,
      googleEventId: event.id,
      googleCalendarName: calSummary,
      googleShared: !!shared,
      created: event.created ? new Date(event.created).getTime() : Date.now(),
      updated: event.updated ? new Date(event.updated).getTime() : Date.now()
    };
    // A ✔ / ✖ title mark carries the status. Only set when a mark is present, so
    // an unmarked event never overrides what the person ticked off in TaskIt.
    if (mark.done || mark.cancelled) {
      patch.done = mark.done;
      patch.cancelled = mark.cancelled;
    }
    // googleRawLength / googleAllDay remember what the event really looked like in
    // Google, so writing an edit back never silently reshapes it (see
    // patchForeignEvent). They're always set explicitly so a stale value can't
    // survive a later pull's merge.
    patch.googleRawLength = null;
    patch.googleAllDay = false;
    if (event.start?.dateTime) {
      const d = new Date(event.start.dateTime);
      const e = event.end?.dateTime ? new Date(event.end.dateTime) : null;
      patch.date = localDs(d);
      patch.time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      if (e) {
        // Length is smoothed to the nearest quarter hour (00/15/30/45 min) so it
        // always reads cleanly in the form, diary grid and share image; never
        // shorter than 15 min.
        const raw = Math.round((e - d) / 60000);
        patch.length = roundLengthToQuarter(raw);
        patch.googleRawLength = raw;
      } else {
        patch.length = null;
      }
    } else if (event.start?.date) {
